<main class="container">
  <h1>Gestor de Tareas DAW</h1>
  <p class="subtitulo">Arquitectura Modular con Signals e Inyección de Dependencias</p>
  <!-- Formulario de alta -->
  <div class="formulario">
    <input
      type="text"
      [value]="nuevaTareaInput()"
      (input)="actualizarTexto($event)"
      placeholder="Escribe una nueva tarea..."
    />
    <button (click)="agregar()">Añadir Tarea</button>
  </div>
  <!-- Listado de tareas usando el componente hijo -->
  <div class="lista">
    @for (item of listaTareas(); track $index) {
      <app-tarea-item [tarea]="item" [index]="$index" (onEliminar)="borrar($event)" />
    } @empty {
      <p class="vacio">No hay tareas pendientes. ¡Buen trabajo!</p>
    }
  </div>
</main>
